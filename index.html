<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat the Greatest</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080b10;
  color:#f4f7fb;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  width:100%;
  max-width:760px;
  margin:auto;
  min-height:100vh;
  padding:16px 14px 40px;
}

.header{
  text-align:center;
  margin-bottom:12px;
}

.header h1{
  margin:0;
  font-size:25px;
  letter-spacing:2px;
  font-weight:900;
}

.header p{
  margin:5px 0 0;
  color:#8d98a8;
  font-size:12px;
}

/* CHALLENGE */

.challenge{
  background:linear-gradient(135deg,#111923,#0c1118);
  border:1px solid #273140;
  border-radius:16px;
  padding:12px 14px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.challenge small{
  color:#7e8998;
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  margin-bottom:3px;
}

.challenge strong{
  font-size:15px;
}

.team{
  display:flex;
  align-items:center;
  gap:9px;
}

.team-logo{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#183b70;
  border:2px solid #4285ff;
  color:#fff;
  font-size:10px;
  font-weight:900;
}

/* RADAR */

.radar-panel{
  background:#0c1118;
  border:1px solid #222c39;
  border-radius:20px;
  padding:10px 10px 5px;
  position:sticky;
  top:5px;
  z-index:20;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
}

.radar-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 5px;
}

.radar-title{
  font-size:11px;
  font-weight:900;
  letter-spacing:1.3px;
  color:#c9d2df;
}

.radar-ovr{
  font-size:12px;
  font-weight:900;
}

svg{
  width:100%;
  height:min(43vh,340px);
  display:block;
}

.grid{
  fill:none;
  stroke:#26303d;
  stroke-width:1;
}

.axis{
  stroke:#202a36;
  stroke-width:1;
}

.champ{
  fill:rgba(35,111,255,.12);
  stroke:#2675ff;
  stroke-width:3;
}

.user{
  fill:rgba(31,210,112,.07);
  stroke:#21d879;
  stroke-width:3;
  stroke-dasharray:2 7;
  stroke-linecap:round;
}

.radar-label{
  fill:#aab4c2;
  font-size:10px;
  font-weight:800;
  text-anchor:middle;
}

.legend{
  display:flex;
  justify-content:center;
  gap:20px;
  padding:2px 0 8px;
  font-size:10px;
  color:#8792a1;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:5px;
}

.blue{background:#2675ff}
.green{background:#21d879}

/* SWITCH */

.mode-switch{
  display:flex;
  background:#0c1118;
  border:1px solid #222c39;
  padding:4px;
  border-radius:12px;
  margin:10px 0;
}

.mode-switch button{
  flex:1;
  border:0;
  background:transparent;
  color:#778394;
  padding:9px;
  border-radius:9px;
  font-weight:900;
  font-size:11px;
}

.mode-switch button.active{
  background:#182330;
  color:#fff;
}

/* POSITION */

.selection{
  margin-top:10px;
}

.selection-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin-bottom:9px;
}

.selection-head small{
  color:#728092;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1.4px;
}

.selection-head h2{
  margin:2px 0 0;
  font-size:20px;
}

.progress{
  color:#21d879;
  font-size:11px;
  font-weight:900;
}

/* PLAYER CARDS */

.players{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.player-card{
  background:#101720;
  border:1px solid #263140;
  border-radius:14px;
  padding:9px;
  min-height:76px;
  display:flex;
  align-items:center;
  gap:9px;
  cursor:pointer;
  transition:.15s;
}

.player-card:hover{
  border-color:#21d879;
  transform:translateY(-1px);
}

.player-card.selected{
  border-color:#21d879;
  background:#102119;
  box-shadow:0 0 0 1px rgba(33,216,121,.15);
}

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:linear-gradient(145deg,#202c3b,#111820);
  border:1px solid #344152;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:900;
  color:#aeb9c8;
}

.player-info{
  min-width:0;
}

.player-name{
  font-size:12px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-year{
  color:#7c8999;
  font-size:9px;
  margin-top:3px;
}

.player-era{
  color:#4d9cff;
  font-size:8px;
  margin-top:3px;
  text-transform:uppercase;
  letter-spacing:.7px;
}

.check{
  margin-left:auto;
  color:#21d879;
  font-size:14px;
}

/* ROSTER */

.roster{
  margin-top:12px;
  background:#0c1118;
  border:1px solid #222c39;
  border-radius:16px;
  padding:12px;
}

.roster-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.roster-title strong{
  font-size:12px;
}

.roster-title span{
  font-size:10px;
  color:#7d8999;
}

.roster-strip{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:3px;
}

.roster-chip{
  min-width:70px;
  background:#111923;
  border:1px solid #263140;
  border-radius:9px;
  padding:6px;
  text-align:center;
}

.roster-chip .pos{
  font-size:8px;
  color:#667487;
}

.roster-chip .nm{
  font-size:9px;
  font-weight:900;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.roster-chip.empty{
  opacity:.45;
}

/* BUTTONS */

.controls{
  display:flex;
  gap:7px;
  margin-top:10px;
}

button.action{
  border:0;
  border-radius:11px;
  padding:11px 12px;
  font-weight:900;
  font-size:11px;
  cursor:pointer;
}

.next{
  flex:1;
  background:#21d879;
  color:#06120b;
}

.secondary{
  background:#17202b;
  color:#d3dae4;
  border:1px solid #293544 !important;
}

.hidden{
  display:none!important;
}

/* GAME */

.game{
  margin-top:12px;
  background:#0c1118;
  border:1px solid #263140;
  border-radius:18px;
  padding:14px;
}

.scoreboard{
  display:flex;
  justify-content:space-around;
  text-align:center;
  margin:8px 0 15px;
}

.score-team{
  font-size:10px;
  color:#7c8999;
}

.score{
  font-size:31px;
  font-weight:900;
  margin-top:3px;
}

.inning{
  text-align:center;
  color:#21d879;
  font-size:11px;
  font-weight:900;
  letter-spacing:1px;
}

.play{
  background:#111923;
  border-radius:12px;
  border:1px solid #263140;
  padding:12px;
  min-height:80px;
  color:#c5ceda;
  font-size:12px;
  line-height:1.5;
}

.game-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.full{
  grid-column:1/-1;
}

/* MOBILE */

@media(max-width:500px){
  .players{
    grid-template-columns:1fr;
  }

  svg{
    height:300px;
  }

  .radar-panel{
    top:2px;
  }
}
</style>
</head>

<div class="app">

  <div class="header">
    <h1>BEAT THE GREATEST</h1>
    <p>Build a team. Beat baseball history.</p>
  </div>

  <div class="challenge">
    <div>
      <small>Today's Challenge</small>
      <strong id="opponentName">Loading...</strong>
    </div>

    <div class="team">

    </div>
  </div>

  <div class="radar-panel">

    <div class="radar-top">
      <div class="radar-title" id="radarTitle">FIELDING PROFILE</div>
      <div class="radar-ovr" id="userOvr">TEAM OVR 50</div>
    </div>

    <svg id="radar" viewBox="0 0 400 330"></svg>

    <div class="legend">
      <span><i class="dot blue"></i>Championship Team</span>
      <span><i class="dot green"></i>Your Team</span>
    </div>

  </div>

  <div class="mode-switch">
    <button id="fieldBtn" class="active" onclick="setMode('field')">
      FIELDERS
    </button>

    <button id="pitchBtn" onclick="setMode('pitch')">
      PITCHERS
    </button>
  </div>

  <div id="draftArea">

    <div class="selection">

      <div class="selection-head">

        <div>
          <small id="sectionLabel">Build Your Team</small>
          <h2 id="positionTitle">Choose Your Catcher</h2>
        </div>

        <div class="progress" id="progress">
          0 / 27
        </div>

      </div>

      <div class="players" id="players"></div>

      <div class="controls">
        <button class="action secondary" onclick="rerollChoices()">REROLL</button>
        <button class="action secondary" onclick="goBack()">BACK</button>
        <button class="action next" id="nextBtn" onclick="advance()">NEXT</button>
      </div>

    </div>

    <div class="roster">

      <div class="roster-title">
        <strong>YOUR ROSTER</strong>
        <span id="rosterCount">0 / 27</span>
      </div>

      <div class="roster-strip" id="rosterStrip"></div>

    </div>

  </div>

  <!-- GAME AREA -->

  <div class="game hidden" id="gameArea">

    <div class="inning" id="inningText">TOP 1ST</div>

    <div class="scoreboard">
      <div>
        <div class="score-team">YOUR TEAM</div>
        <div class="score" id="userScore">0</div>
      </div>

      <div>
        <div class="score-team" id="gameOpponent">OPPONENT</div>
        <div class="score" id="oppScore">0</div>
      </div>
    </div>

    <div class="play" id="playText">
      The game is ready to begin.
    </div>

    <div class="game-buttons">
      <button class="action next full" onclick="simulateHalfInning()">
        SIMULATE HALF-INNING
      </button>

      <button class="action secondary" onclick="makePitchingChange()">
        USE RELIEVER
      </button>

      <button class="action secondary" onclick="makeBenchChange()">
        USE BENCH
      </button>
    </div>

  </div>

</div>

["Jacob deGrom",2018,100,99,95,100,92,98],
["Gerrit Cole",2023,99,97,94,99,96,97],
["Zack Greinke",2015,91,99,99,94,97,96]
];


/* ============================================================
   ROSTER STRUCTURE — FULL 27 MAN ROSTER
   ============================================================ */

const fieldSlots = [
"C","1B","2B","SS","3B","LF","CF","RF","DH",
"Bench 1","Bench 2","Bench 3","Bench 4","Bench 5","Bench 6"
];

const pitchSlots = [
"SP 1","SP 2","SP 3","SP 4","SP 5","SP 6",
"RP 1","RP 2","RP 3","RP 4","CL"
];


/* ============================================================
   STATE
   ============================================================ */

let mode="field";

let fieldIndex=0;
let pitchIndex=0;

let selectedField={};
let selectedPitch={};

let currentChoices=[];

let gameStarted=false;
let inning=1;
let half="top";
let userScore=0;
let oppScore=0;
let pitcherFatigue=0;


/* ============================================================
   HELPERS
   ============================================================ */

function initials(name){
  return name.split(" ").map(x=>x[0]).slice(0,2).join("");
}

function randomFive(array){

  let copy=[...array];

  for(let i=copy.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy.slice(0,5);
}

function averagePlayers(players, count){

  if(!players.length) return Array(count).fill(50);

  let result=Array(count).fill(0);

  players.forEach(p=>{
    p.forEach((value,i)=>{
      result[i]+=Number(value);
    });
  });

  return result.map(x=>Math.round(x/players.length));
}


/* ============================================================
   RADAR
   ============================================================ */

function drawRadar(){

  const svg=document.getElementById("radar");

  let labels;
  let champ;
  let user;

  if(mode==="field"){

    labels=["POWER","CONTACT","DEFENSE","SPEED","CLUTCH"];

    champ=opponent.hit;

    const players=Object.values(selectedField);

    user=players.length
      ? averagePlayers(players,5)
      : [50,50,50,50,50];

  }else{

    labels=["VELOCITY","MOVEMENT","CONTROL","K'S","STAMINA","CLUTCH"];

    champ=opponent.pitch;

    const players=Object.values(selectedPitch);

    user=players.length
      ? averagePlayers(players,6)
      : [50,50,50,50,50,50];
  }

  const cx=200;
  const cy=155;
  const radius=105;

  let points=[];

  for(let i=0;i<labels.length;i++){

    let angle=(-Math.PI/2)+(i*2*Math.PI/labels.length);

    points.push({
      x:cx+Math.cos(angle)*radius,
      y:cy+Math.sin(angle)*radius,
      angle
    });
  }

  let html="";

  /* GRID */

  [25,50,75,100].forEach(scale=>{

    let pts=points.map(p=>{

      let r=radius*scale/100;

      return `${cx+Math.cos(p.angle)*r},${cy+Math.sin(p.angle)*r}`;

    }).join(" ");

    html+=`<polygon class="grid" points="${pts}"/>`;

  });

  /* AXES */

  points.forEach(p=>{
    html+=`
      <line
        class="axis"
        x1="${cx}"
        y1="${cy}"
        x2="${p.x}"
        y2="${p.y}"
      />
    `;
  });

  function polygon(values,cls){

    return values.map((v,i)=>{

      let r=radius*Math.max(0,Math.min(100,v))/100;

      return `${cx+Math.cos(points[i].angle)*r},${cy+Math.sin(points[i].angle)*r}`;

    }).join(" ");

  }

  html+=`
    <polygon class="champ"
      points="${polygon(champ)}"/>
  `;

  html+=`
    <polygon class="user"
      points="${polygon(user)}"/>
  `;

  labels.forEach((label,i)=>{

    const labelRadius=radius+25;

    const x=cx+Math.cos(points[i].angle)*labelRadius;
    const y=cy+Math.sin(points[i].angle)*labelRadius;

    html+=`
      <text
        class="radar-label"
        x="${x}"
        y="${y}">
        ${label}
      </text>
    `;

  });

  svg.innerHTML=html;

  let ovr=Math.round(
    user.reduce((a,b)=>a+b,0)/user.length
  );

  document.getElementById("userOvr").textContent =
    `TEAM OVR ${ovr}`;

  document.getElementById("radarTitle").textContent =
    mode==="field"
      ? "FIELDING PROFILE"
      : "PITCHING PROFILE";
}


/* ============================================================
   MODE
   ============================================================ */

function setMode(newMode){

  mode=newMode;

  document.getElementById("fieldBtn")
    .classList.toggle("active",mode==="field");

  document.getElementById("pitchBtn")
    .classList.toggle("active",mode==="pitch");

  loadChoices();
  drawRadar();
}


/* ============================================================
   LOAD FIVE CHOICES
   ============================================================ */

function loadChoices(){

  let pool;

  if(mode==="field"){

    let slot=fieldSlots[fieldIndex];

    let key=slot;

    if(slot.startsWith("Bench")){
      key=[
        "LF","CF","RF","2B","3B","SS"
      ][fieldIndex-9] || "RF";
    }

    pool=fieldPlayers[key];

    currentChoices=randomFive(pool);

    document.getElementById("positionTitle").textContent =
      fieldIndex<9
      ? `Choose Your ${slot==="C"?"Catcher":
         slot==="1B"?"First Baseman":
         slot==="2B"?"Second Baseman":
         slot==="SS"?"Shortstop":
         slot==="3B"?"Third Baseman":
         slot==="LF"?"Left Fielder":
         slot==="CF"?"Center Fielder":
         slot==="RF"?"Right Fielder":
         "DH"}`
      : `Choose ${slot}`;

    document.getElementById("progress").textContent =
      `${Object.keys(selectedField).length + Object.keys(selectedPitch).length} / 27`;

  }else{

    pool=pitchers;

    currentChoices=randomFive(pool);

    document.getElementById("positionTitle").textContent =
      `Choose Your ${pitchSlots[pitchIndex]}`;

    document.getElementById("progress").textContent =
      `${Object.keys(selectedField).length + Object.keys(selectedPitch).length} / 27`;
  }

  renderChoices();
  renderRoster();
}


/* ============================================================
   RENDER PLAYER CARDS
   ============================================================ */

function renderChoices(){

  const box=document.getElementById("players");

  box.innerHTML="";

  currentChoices.forEach(player=>{

    let name=player[0];

    let selected=false;

    if(mode==="field"){
      selected=Object.values(selectedField)
        .some(p=>p[0]===name);
    }else{
      selected=Object.values(selectedPitch)
        .some(p=>p[0]===name);
    }

    let card=document.createElement("div");

    card.className=
      "player-card"+
      (selected?" selected":"");

    card.onclick=()=>selectPlayer(player);

    card.innerHTML=`

      <div class="avatar">
        ${initials(name)}
      </div>

      <div class="player-info">

        <div class="player-name">
          ${name}
        </div>

        <div class="player-year">
          Best Season: ${player[1]}
        </div>

        <div class="player-era">
          ${era(player[1])}
        </div>

      </div>

      ${selected?'<div class="check">✓</div>':''}

    `;

    box.appendChild(card);

  });
}

function era(year){

  if(year<1930)return"1920s";
  if(year<1940)return"1930s";
  if(year<1950)return"1940s";
  if(year<1960)return"1950s";
  if(year<1970)return"1960s";
  if(year<1980)return"1970s";
  if(year<1990)return"1980s";
  if(year<2000)return"1990s";
  if(year<2010)return"2000s";
  if(year<2020)return"2010s";
  return"2020s";
}


/* ============================================================
   SELECT PLAYER
   ============================================================ */

function selectPlayer(player){

  if(mode==="field"){

    selectedField[fieldSlots[fieldIndex]]=player;

  }else{

    selectedPitch[pitchSlots[pitchIndex]]=player;

  }

  renderChoices();
  renderRoster();
  drawRadar();
}


/* ============================================================
   NEXT
   ============================================================ */

function advance(){

  if(mode==="field"){

    if(!selectedField[fieldSlots[fieldIndex]]){

      alert("Choose a player first.");

      return;
    }

    if(fieldIndex<fieldSlots.length-1){

      fieldIndex++;

      loadChoices();

      return;
    }

    /* Switch automatically to pitching */

    mode="pitch";

    document.getElementById("fieldBtn")
      .classList.remove("active");

    document.getElementById("pitchBtn")
      .classList.add("active");

    loadChoices();
    drawRadar();

    return;

  }

  if(mode==="pitch"){

    if(!selectedPitch[pitchSlots[pitchIndex]]){

      alert("Choose a pitcher first.");

      return;
    }

    if(pitchIndex<pitchSlots.length-1){

      pitchIndex++;

      loadChoices();

      return;
    }

    finishDraft();
  }
}


/* ============================================================
   BACK
   ============================================================ */

function goBack(){

  if(mode==="field"){

    if(fieldIndex>0){

      fieldIndex--;

      loadChoices();
    }

  }else{

    if(pitchIndex>0){

      pitchIndex--;

      loadChoices();

    }else{

      mode="field";

      fieldIndex=fieldSlots.length-1;

      setMode("field");
    }
  }
}


/* ============================================================
   REROLL
   ============================================================ */

function rerollChoices(){

  loadChoices();
}


/* ============================================================
   ROSTER DISPLAY
   ============================================================ */

function renderRoster(){

  const box=document.getElementById("rosterStrip");

  box.innerHTML="";

  fieldSlots.forEach(slot=>{

    let player=selectedField[slot];

    let chip=document.createElement("div");

    chip.className=
      "roster-chip"+
      (!player?" empty":"");

    chip.innerHTML=`

      <div class="pos">${slot}</div>

      <div class="nm">
        ${player?player[0]:"EMPTY"}
      </div>

    `;

    box.appendChild(chip);

  });

  pitchSlots.forEach(slot=>{

    let player=selectedPitch[slot];

    let chip=document.createElement("div");

    chip.className=
      "roster-chip"+
      (!player?" empty":"");

    chip.innerHTML=`

      <div class="pos">${slot}</div>

      <div class="nm">
        ${player?player[0]:"EMPTY"}
      </div>

    `;

    box.appendChild(chip);

  });

  const total=
    Object.keys(selectedField).length+
    Object.keys(selectedPitch).length;

  document.getElementById("rosterCount").textContent=
    `${total} / 27`;

}


/* ============================================================
   FINISH DRAFT
   ============================================================ */

function finishDraft(){

  document.getElementById("draftArea")
    .classList.add("hidden");

  document.getElementById("gameArea")
    .classList.remove("hidden");

  gameStarted=true;

  document.getElementById("gameOpponent")
    .textContent=opponent.name
    .replace(/[0-9]/g,"")
    .trim();

  document.getElementById("playText").textContent=
    `Your twenty-seven-man roster is complete. `+
    `${opponent.name} is waiting. `+
    `The first pitch is ready.`;

}


/* ============================================================
   GAME ENGINE
   ============================================================ */

function simulateHalfInning(){

  if(!gameStarted)return;

  let userHitters=
    Object.values(selectedField);

  let userPitchers=
    Object.values(selectedPitch);

  if(!userHitters.length || !userPitchers.length)return;

  let userOffense=
    averagePlayers(userHitters,5)
      .reduce((a,b)=>a+b,0)/5;

  let userPitch=
    averagePlayers(userPitchers,6)
      .reduce((a,b)=>a+b,0)/6;

  let opponentOffense=
    opponent.hit.reduce((a,b)=>a+b,0)/5;

  let opponentPitch=
    opponent.pitch.reduce((a,b)=>a+b,0)/6;

  let runs=0;

  if(half==="top"){

    let strength=
      userOffense-opponentPitch+Math.random()*35;

    runs=Math.max(
      0,
      Math.min(5,Math.floor(strength/18))
    );

    userScore+=runs;

    document.getElementById("playText").textContent=
      generatePlay(
        true,
        runs,
        userOffense,
        opponentPitch
      );

    half="bottom";

  }else{

    let strength=
      opponentOffense-userPitch+Math.random()*35;

    runs=Math.max(
      0,
      Math.min(5,Math.floor(strength/18))
    );

    oppScore+=runs;

    document.getElementById("playText").textContent=
      generatePlay(
        false,
        runs,
        opponentOffense,
        userPitch
      );

    half="top";
    inning++;
  }

  pitcherFatigue+=
    Math.floor(Math.random()*8)+3;

  updateScoreboard();
}


function generatePlay(user,runs,offense,pitching){

  if(runs===0){

    let plays=[
      "The pitcher works out of trouble with a strikeout.",
      "A hard-hit ball dies at the warning track.",
      "Three up, three down.",
      "The defense makes a big play to end the threat.",
      "A quality pitching sequence shuts the inning down."
    ];

    return plays[
      Math.floor(Math.random()*plays.length)
    ];
  }

  if(runs===1)
    return user
      ? "A clutch two-out hit brings home a run."
      : "The opponent strings together a pair of hits.";

  if(runs===2)
    return user
      ? "A gap shot drives in two. Big inning."
      : "A double puts runners in scoring position and two come home.";

  if(runs>=3)
    return user
      ? "The lineup explodes. Three runs cross the plate."
      : "The opponent breaks the game open with a huge inning.";

  return "The inning is over.";
}


/* ============================================================
   SCOREBOARD
   ============================================================ */

function updateScoreboard(){

  document.getElementById("userScore")
    .textContent=userScore;

  document.getElementById("oppScore")
    .textContent=oppScore;

  let ordinal=
    inning===1?"1ST":
    inning===2?"2ND":
    inning===3?"3RD":
    `${inning}TH`;

  document.getElementById("inningText")
    .textContent=
      `${half==="top"?"TOP":"BOTTOM"} ${ordinal}`;
}


/* ============================================================
   MANAGEMENT
   ============================================================ */

function makePitchingChange(){

  let relievers=
    Object.keys(selectedPitch)
      .filter(x=>x.startsWith("RP")||x==="CL");

  if(!relievers.length){

    document.getElementById("playText").textContent=
      "No bullpen arms are available.";

    return;
  }

  let chosen=
    selectedPitch[
      relievers[
        Math.floor(Math.random()*relievers.length)
      ]
    ];

  pitcherFatigue=0;

  document.getElementById("playText").textContent=
    `${chosen[0]} is coming out of the bullpen. `+
    `Fresh arm. Time to attack.`;
}


function makeBenchChange(){

  let benches=
    Object.keys(selectedField)
      .filter(x=>x.startsWith("Bench"));

  if(!benches.length){

    document.getElementById("playText").textContent=
      "No bench players are available.";

    return;
  }

  let chosen=
    selectedField[
      benches[
        Math.floor(Math.random()*benches.length)
      ]
    ];

  document.getElementById("playText").textContent=
    `${chosen[0]} is entering the game from the bench.`;
}


/* ============================================================
   INITIALIZE
   ============================================================ */

loadChoices();
drawRadar();
renderRoster();

</script>
