<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Beat the Greatest</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#070a0f;
  color:#f4f7fb;
  font-family:Arial,Helvetica,sans-serif;
}

.app{
  max-width:760px;
  margin:auto;
  padding:14px 12px 50px;
}

/* HEADER */

.header{
  text-align:center;
  margin-bottom:10px;
}

.header h1{
  margin:0;
  font-size:25px;
  font-weight:900;
  letter-spacing:2px;
}

.header p{
  margin:5px 0 0;
  color:#7f8a99;
  font-size:11px;
}

/* OPPONENT */

.challenge{
  background:linear-gradient(135deg,#111923,#0b1017);
  border:1px solid #273241;
  border-radius:17px;
  padding:10px 13px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}

.challenge-label{
  font-size:9px;
  letter-spacing:1.5px;
  color:#718093;
  text-transform:uppercase;
}

.challenge-name{
  font-size:15px;
  font-weight:900;
  margin-top:3px;
}

.team-mark{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#17396c;
  border:2px solid #2877ff;
  font-size:10px;
  font-weight:900;
}

/* RADAR */

.radar-panel{
  background:#0b1017;
  border:1px solid #273241;
  border-radius:21px;
  padding:5px 8px 5px;
  position:sticky;
  top:3px;
  z-index:30;
  box-shadow:0 15px 45px rgba(0,0,0,.5);
}

.radar{
  width:100%;
  height:min(48vh,370px);
  display:block;
}

.grid{
  fill:none;
  stroke:#27313e;
  stroke-width:1;
}

.axis{
  stroke:#202a35;
  stroke-width:1;
}

.champ-poly{
  fill:rgba(39,117,255,.10);
  stroke:#2877ff;
  stroke-width:3.5;
}

.user-poly{
  fill:rgba(31,214,113,.07);
  stroke:#20d878;
  stroke-width:3.5;
  stroke-dasharray:2 7;
  stroke-linecap:round;
}

.radar-label{
  fill:#9da8b6;
  font-size:9px;
  font-weight:900;
  text-anchor:middle;
}

.legend{
  display:flex;
  justify-content:center;
  gap:18px;
  padding:2px 0 7px;
  color:#778493;
  font-size:9px;
}

.legend i{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:4px;
}

.legend .blue{background:#2877ff}
.legend .green{background:#20d878}

/* MODE */

.mode{
  display:flex;
  gap:4px;
  padding:4px;
  background:#0b1017;
  border:1px solid #252f3b;
  border-radius:12px;
  margin:9px 0;
}

.mode button{
  flex:1;
  border:0;
  background:transparent;
  color:#758294;
  border-radius:9px;
  padding:8px;
  font-size:10px;
  font-weight:900;
}

.mode button.active{
  background:#17212d;
  color:#fff;
}

/* OPPONENT ROSTER */

.roster-panel{
  background:#0b1017;
  border:1px solid #252f3b;
  border-radius:17px;
  padding:11px;
  margin-top:9px;
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}

.panel-title strong{
  font-size:11px;
  letter-spacing:1px;
}

.panel-title span{
  color:#697687;
  font-size:9px;
}

.opponent-roster{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding-bottom:2px;
}

.mini-player{
  min-width:77px;
  background:#101720;
  border:1px solid #222e3c;
  border-radius:11px;
  padding:5px;
  text-align:center;
}

.mini-photo{
  width:39px;
  height:39px;
  margin:auto;
  border-radius:50%;
  object-fit:cover;
  background:#17202b;
  border:1px solid #34404e;
}

.mini-name{
  font-size:8px;
  font-weight:900;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-pos{
  color:#6f7d8e;
  font-size:7px;
  margin-top:2px;
}

/* DRAFT */

.draft{

.draft-header{

.draft-label{

.progress{

.cards{

.player-card{

.player-card.selected{

.player-stats{

.check{

/* MY ROSTER */

  padding:11px;

.my-roster-scroll{

button.action{

  border-radius:11px;
  padding:11px;
  font-size:10px;
  font-weight:900;

.back{

  background:#17202b;
  color:#cbd3de;
}

.next{

  background:#20d878;
  color:#06120b;

/* GAME */

  background:#0b1017;
  border:1px solid #273241;
  border-radius:18px;
  padding:13px;

.hidden{

.inning{

.score-dash{

.game-controls{

  color:#738091;
  padding:18px;

@media(max-width:500px){
  .cards{

</style>
</head>

/* ============================================================
   BASIC HELPERS
   ============================================================ */

function shuffle(arr){

  const copy=[...arr];

  for(let i=copy.length-1;i>0;i--){

    const j=Math.floor(Math.random()*(i+1));

    [copy[i],copy[j]]=[copy[j],copy[i]];
  }

  return copy;
}

function average(arr){

  if(!arr.length)return 0;

  return arr.reduce((a,b)=>a+b,0)/arr.length;
}

function clamp(v,min=0,max=100){

  return Math.max(min,Math.min(max,v));
}


/* ============================================================
   MLB API
   ============================================================ */

async function api(url){

  try{

    const response=await fetch(url);

    if(!response.ok)throw new Error("API error");

    return await response.json();

  }catch(error){

    console.log(error);

    return null;
  }
}


/*
  Find the MLB person ID from the player's name.
*/

async function getPlayer(name){

  if(playerCache[name])return playerCache[name];

  const url=
    `${API}/people/search?sportIds=1&names=${encodeURIComponent(name)}`;

  const data=await api(url);

  if(!data || !data.people || !data.people.length){

    return null;
  }

  const person=
    data.people.find(p=>
      p.fullName.toLowerCase()===name.toLowerCase()
    ) || data.people[0];

  playerCache[name]=person;

  return person;
}


/*
  Pull actual season hitting statistics.
*/

async function getHittingStats(personId,season){

  const key=`h-${personId}-${season}`;

  if(statsCache[key])return statsCache[key];

  const url=
    `${API}/people/${personId}/stats?`+
    `stats=season&group=hitting&season=${season}`;

  const data=await api(url);

  const stat=
    data &&
    data.stats &&
    data.stats[0] &&
    data.stats[0].splits &&
    data.stats[0].splits[0]
      ? data.stats[0].splits[0].stat
      : null;

  statsCache[key]=stat;

  return stat;
}


/*
  Pull actual season pitching statistics.
*/

async function getPitchingStats(personId,season){

  const key=`p-${personId}-${season}`;

  if(statsCache[key])return statsCache[key];

  const url=
    `${API}/people/${personId}/stats?`+
    `stats=season&group=pitching&season=${season}`;

  const data=await api(url);

  const stat=
    data &&
    data.stats &&
    data.stats[0] &&
    data.stats[0].splits &&
    data.stats[0].splits[0]
      ? data.stats[0].splits[0].stat
      : null;

  statsCache[key]=stat;

  return stat;
}

function headshot(personId){

  if(!personId)return"";

  return `https://img.mlbstatic.com/mlb-photos/image/upload/`+

}


/* ============================================================
   REAL-STAT → GAME ATTRIBUTES
   ============================================================ */

function hittingAttributes(stat){

  if(!stat){

    return {
      power:50,
      contact:50,
      defense:50,
      speed:50,
      clutch:50
    };
  }

  const avg=Number(stat.avg)||0;
  const slg=Number(stat.slg)||0;
  const hr=Number(stat.homeRuns)||0;
  const sb=Number(stat.stolenBases)||0;
  const rbi=Number(stat.rbi)||0;
  const obp=Number(stat.obp)||0;

  /*
    These are normalized from the player's actual season
    statistics. They are not arbitrary player ratings.
  */

  const power=clamp(
    35+
    slg*65+
    Math.min(hr,60)*0.35
  );

  const contact=clamp(
    35+
    avg*85+
    obp*25
  );

  const speed=clamp(
    45+
    Math.min(sb,70)*0.65
  );

  /*
    Fielding uses defensive contribution where the API
    exposes it; otherwise it receives a neutral baseline.
  */

  const defense=clamp(
    55+
    Math.min(
      Number(stat.assists)||0,
      500
    )/20
  );

  const clutch=clamp(
    50+
    Math.min(rbi,150)*0.25+
    Math.max(0,(obp-.300)*60)
  );

  return{
    power,
    contact,
    defense,
    speed,
    clutch
  };
}


function pitchingAttributes(stat){

  if(!stat){

    return{
      velocity:50,
      movement:50,
      control:50,
      strikeouts:50,
      stamina:50,
      clutch:50
    };
  }

  const era=Number(stat.era)||4.50;
  const whip=Number(stat.whip)||1.35;
  const k=Number(stat.strikeOuts)||0;
  const ip=Number(stat.inningsPitched)||0;
  const bb=Number(stat.baseOnBalls)||0;
  const wins=Number(stat.wins)||0;

  return{

    velocity:clamp(
      70+
      Math.max(0,4.5-era)*8
    ),

    movement:clamp(
      72+
      Math.max(0,1.35-whip)*45
    ),

    control:clamp(
      70+
      Math.max(0,100-bb)*.18
    ),

    strikeouts:clamp(
      40+
      Math.min(k,300)*.20
    ),

    stamina:clamp(
      40+
      Math.min(ip,250)*.25
    ),

    clutch:clamp(
      55+
      Math.min(wins,25)*1.3
    )
  };
}


/* ============================================================
   PLAYER OBJECT
   ============================================================ */

async function buildPlayer(raw){

  const name=raw[0];
  const season=raw[1];

  const person=await getPlayer(name);

  let attributes;

  if(raw[2]==="P"){

    const stat=
      person
        ? await getPitchingStats(person.id,season)
        : null;

    attributes=pitchingAttributes(stat);

  }else{

    const stat=
      person
        ? await getHittingStats(person.id,season)
        : null;

    attributes=hittingAttributes(stat);
  }

  return{
    name,
    season,
    type:raw[2],
    id:person ? person.id:null,
    photo:person ? headshot(person.id):"",
    stats:attributes
  };
}


/* ============================================================
   PLAYER POOL
   ============================================================ */

function eligiblePlayers(position){

  if(position==="C")
    return PLAYERS.filter(p=>p[2]==="C");

  if(position==="1B")
    return PLAYERS.filter(p=>p[2]==="1B");

  if(position==="2B")
    return PLAYERS.filter(p=>p[2]==="2B");

  if(position==="SS")
    return PLAYERS.filter(p=>p[2]==="SS");

  if(position==="3B")
    return PLAYERS.filter(p=>p[2]==="3B");

  if(position==="LF"||position==="CF"||position==="RF")
    return PLAYERS.filter(p=>p[2]==="OF");

  if(position==="DH")
    return PLAYERS.filter(p=>["1B","DH","OF"].includes(p[2]));

  if(position.startsWith("B")){
    return PLAYERS.filter(p=>
      ["1B","2B","SS","3B","OF"].includes(p[2])
    );
  }

  return [];
}


/* ============================================================
   RANDOM FIVE — NO REROLL
   ============================================================ */

async function generateChoices(){

  let pool=[];

  if(mode==="field"){

    const slot=FIELD_SLOTS[fieldIndex];

    pool=eligiblePlayers(slot.id);

  }else{

    pool=PLAYERS.filter(p=>p[2]==="P");

  }

  /*
    Shuffle the historical pool first.
    Then choose five.
  */

  const rawChoices=
    shuffle(pool).slice(0,5);

  document.getElementById("cards").innerHTML=
    `<div class="loading">Loading historical players...</div>`;

  choices=[];

  for(const raw of rawChoices){

    const player=
      await buildPlayer(raw);

    choices.push(player);
  }

  renderChoices();
}


/* ============================================================
   RENDER CHOICES
   ============================================================ */

function renderChoices(){

  const box=document.getElementById("cards");

  box.innerHTML="";

  choices.forEach(player=>{

    const card=document.createElement("div");

    const selected=
      Object.values(myField)
        .concat(Object.values(myPitch))
        .some(p=>p && p.name===player.name);

    card.className=
      "player-card"+
      (selected?" selected":"");

    card.onclick=()=>choosePlayer(player);

    const image=
      player.photo
      ? `<img class="photo" src="${player.photo}" onerror="this.style.display='none'">`
      : `<div class="photo"></div>`;

    const statLine=
      mode==="field"
      ? `PWR ${Math.round(player.stats.power)} · CON ${Math.round(player.stats.contact)}`
      : `VEL ${Math.round(player.stats.velocity)} · K ${Math.round(player.stats.strikeouts)}`;

    card.innerHTML=`

      ${image}

      <div>
        <div class="player-name">${player.name}</div>

        <div class="player-meta">
          ${player.season} · ${eraName(player.season)}
        </div>

        <div class="player-stats">
          ${statLine}
        </div>
      </div>

      ${selected?'<div class="check">✓</div>':''}

    `;

    box.appendChild(card);
  });
}


function eraName(year){

  if(year<1930)return"1920s";
  if(year<1940)return"1930s";
  if(year<1950)return"1940s";
  if(year<1960)return"1950s";
  if(year<1970)return"1960s";
  if(year<1980)return"1970s";
  if(year<1990)return"1980s";
  if(year<2000)return"1990s";
  if(year<2010)return"2000s";
  if(year<2020)return"2010s";
  return"2020s";
}


/* ============================================================
   CHOOSE PLAYER
   ============================================================ */

function choosePlayer(player){

  if(mode==="field"){

    myField[
      FIELD_SLOTS[fieldIndex].id
    ]=player;

  }else{

    myPitch[
      PITCH_SLOTS[pitchIndex].id
    ]=player;
  }

  renderMyRoster();

  /*
    THIS is the important fix.

    Every selection immediately rebuilds the user polygon
    from the actual player statistics.
  */

  updateRadar();
  renderChoices();
}


/* ============================================================
   MODE
   ============================================================ */

function changeMode(newMode){

  mode=newMode;

  document.getElementById("fieldMode")
    .classList.toggle("active",mode==="field");

  document.getElementById("pitchMode")
    .classList.toggle("active",mode==="pitch");

  updateDraftTitle();

  generateChoices();
  updateRadar();
}


/* ============================================================
   NEXT
   ============================================================ */

function nextPick(){

  if(mode==="field"){

    const slot=FIELD_SLOTS[fieldIndex];

    if(!myField[slot.id]){

      alert("Choose a player first.");

      return;
    }

    if(fieldIndex<FIELD_SLOTS.length-1){

      fieldIndex++;

      updateDraftTitle();

      generateChoices();

      return;
    }

    mode="pitch";

    document.getElementById("fieldMode")
      .classList.remove("active");

    document.getElementById("pitchMode")
      .classList.add("active");

    updateDraftTitle();

    generateChoices();

    updateRadar();

    return;
  }

  const slot=PITCH_SLOTS[pitchIndex];

  if(!myPitch[slot.id]){

    alert("Choose a pitcher first.");

    return;
  }

  if(pitchIndex<PITCH_SLOTS.length-1){

    pitchIndex++;

    updateDraftTitle();

    generateChoices();

    return;
  }

  startGame();
}


/* ============================================================
   BACK
   ============================================================ */

function goBack(){

  if(mode==="field"){

    if(fieldIndex>0){

      fieldIndex--;

      updateDraftTitle();
      generateChoices();
    }

    return;
  }

  if(pitchIndex>0){

    pitchIndex--;

    updateDraftTitle();
    generateChoices();

  }else{

    mode="field";

    fieldIndex=FIELD_SLOTS.length-1;

    document.getElementById("fieldMode")
      .classList.add("active");

    document.getElementById("pitchMode")
      .classList.remove("active");

    updateDraftTitle();
    generateChoices();
  }
}


/* ============================================================
   DRAFT TITLE
   ============================================================ */

function updateDraftTitle(){

  const slot=
    mode==="field"
    ? FIELD_SLOTS[fieldIndex]
    : PITCH_SLOTS[pitchIndex];

  document.getElementById("draftTitle").textContent=
    `Choose Your ${slot.label}`;

  const count=
    Object.keys(myField).length+

  document.getElementById("progress").textContent=

}

   MY ROSTER
   ============================================================ */

function renderMyRoster(){

  FIELD_SLOTS.forEach(slot=>{

        <div class="name">
          ${p?p.name:"EMPTY"}
        </div>

      </div>
    `;

/* ============================================================
   RADAR MATH
   ============================================================ */

function userFieldRadar(){

  const players=
    Object.values(myField)
      .filter(Boolean);

  if(!players.length)
    return [0,0,0,0,0];

  return[

    average(players.map(p=>p.stats.power)),

    average(players.map(p=>p.stats.contact)),

    average(players.map(p=>p.stats.defense)),

    average(players.map(p=>p.stats.speed)),

    average(players.map(p=>p.stats.clutch))

  ];
}


function userPitchRadar(){

  const players=
    Object.values(myPitch)
      .filter(Boolean);

  if(!players.length)
    return [0,0,0,0,0,0];

  return[

    average(players.map(p=>p.stats.velocity)),

    average(players.map(p=>p.stats.movement)),

    average(players.map(p=>p.stats.control)),

    average(players.map(p=>p.stats.strikeouts)),

    average(players.map(p=>p.stats.stamina)),

    average(players.map(p=>p.stats.clutch))

  ];
}


/*
  Championship profile.

  This is intentionally NOT 100 across the board.

  The team profile is generated from its actual historical
  roster once MLB returns the roster.
*/

function championshipFieldRadar(){

  const players=
    opponentRoster
      .filter(p=>p.type!=="P")
      .slice(0,9);

  if(!players.length)
    return [72,72,72,72,72];

  return[

    average(players.map(p=>p.stats.power)),

    average(players.map(p=>p.stats.contact)),

    average(players.map(p=>p.stats.defense)),

    average(players.map(p=>p.stats.speed)),

    average(players.map(p=>p.stats.clutch))

  ];
}


function championshipPitchRadar(){

  const players=
    opponentRoster
      .filter(p=>p.type==="P");

  if(!players.length)
    return [72,72,72,72,72,72];

  return[

    average(players.map(p=>p.stats.velocity)),

    average(players.map(p=>p.stats.movement)),

    average(players.map(p=>p.stats.control)),

    average(players.map(p=>p.stats.strikeouts)),

    average(players.map(p=>p.stats.stamina)),

    average(players.map(p=>p.stats.clutch))

  ];
}


/* ============================================================
   RADAR DRAW
   ============================================================ */

function updateRadar(){

  const svg=document.getElementById("radar");

  const labels=
    mode==="field"
    ? ["POWER","CONTACT","DEFENSE","SPEED","CLUTCH"]
    : ["VELOCITY","MOVEMENT","CONTROL","K'S","STAMINA","CLUTCH"];

  const champ=
    mode==="field"
    ? championshipFieldRadar()
    : championshipPitchRadar();

  const user=
    mode==="field"
    ? userFieldRadar()
    : userPitchRadar();

  const cx=200;
  const cy=174;
  const radius=132;

  const points=[];

  labels.forEach((label,i)=>{

    const angle=
      -Math.PI/2+
      i*(2*Math.PI/labels.length);

    points.push({
      angle,
      x:cx+Math.cos(angle)*radius,
      y:cy+Math.sin(angle)*radius
    });
  });

  let html="";

  /* FIXED 0-100 SCALE */

  [25,50,75,100].forEach(level=>{

    const pts=
      points.map(p=>{

        const r=radius*level/100;

        return[
          cx+Math.cos(p.angle)*r,
          cy+Math.sin(p.angle)*r
        ].join(",");

      }).join(" ");

    html+=`
      <polygon
        class="grid"
        points="${pts}">
      </polygon>
    `;
  });

  points.forEach(p=>{

    html+=`
      <line
        class="axis"
        x1="${cx}"
        y1="${cy}"
        x2="${p.x}"
        y2="${p.y}">
      </line>
    `;
  });


  function makePolygon(values){

    return values.map((value,i)=>{

      /*
        A rating of 100 reaches the outer ring.
        A rating of 50 reaches exactly halfway.
      */

      const r=
        radius*
        clamp(value)/100;

      return[
        cx+Math.cos(points[i].angle)*r,
        cy+Math.sin(points[i].angle)*r
      ].join(",");

    }).join(" ");
  }


  html+=`
    <polygon
      class="champ-poly"
      points="${makePolygon(champ)}">
    </polygon>
  `;

  html+=`
    <polygon
      class="user-poly"
      points="${makePolygon(user)}">
    </polygon>
  `;


  labels.forEach((label,i)=>{

    const labelRadius=radius+27;

    const x=
      cx+
      Math.cos(points[i].angle)*
      labelRadius;

    const y=
      cy+
      Math.sin(points[i].angle)*
      labelRadius;

    html+=`
      <text
        class="radar-label"
        x="${x}"
        y="${y}">
        ${label}
      </text>
    `;
  });

  svg.innerHTML=html;
}


/* ============================================================
   HISTORICAL TEAM ROSTER
   ============================================================ */

async function loadOpponentRoster(){

  document.getElementById("opponentName")
    .textContent=opponent.name;

  document.getElementById("opponentMark")
    .textContent=opponent.mark;

  document.getElementById("opponentSeason")
    .textContent=opponent.year;

  const data=
    await api(
      `${API}/teams/${opponent.teamId}/roster`+
      `?season=${opponent.year}`
    );

  if(
    !data||
    !data.roster||
    !data.roster.length
  ){

    /*
      Historical rosters aren't always exposed by the
      current roster endpoint. We still keep the challenge
      alive and use the historical player pool.
    */

    opponentRoster=
      await buildFallbackOpponentRoster();

    renderOpponentRoster();

    updateRadar();

    return;
  }

  const roster=[];

  for(const item of data.roster.slice(0,30)){

    const raw=[
      item.person.fullName,
      opponent.year,
      item.position &&
      item.position.abbreviation==="P"
        ?"P"
        :"OF"
    ];

    const p=
      await buildPlayer(raw);

    p.position=
      item.position &&
      item.position.abbreviation
      ? item.position.abbreviation
      :"";

    roster.push(p);
  }

  opponentRoster=roster;

  renderOpponentRoster();

  updateRadar();
}


/* ============================================================
   FALLBACK HISTORICAL OPPONENT
   ============================================================ */

async function buildFallbackOpponentRoster(){

  const historical=
    PLAYERS
      .filter(p=>
        p[1]===opponent.year
      );

  const pool=
    historical.length
      ? historical
      : shuffle(PLAYERS).slice(0,18);

  const result=[];

  for(const raw of pool.slice(0,18)){

    result.push(
      await buildPlayer(raw)
    );
  }

  return result;
}


/* ============================================================
   OPPONENT ROSTER UI
   ============================================================ */

function renderOpponentRoster(){

  const box=
    document.getElementById("opponentRoster");

  box.innerHTML="";

  opponentRoster.forEach(player=>{

    div.className="mini-player";

      ${photo}

        ${player.name}
      </div>

      <div class="mini-pos">
        ${player.position||player.type}
      </div>
    `;

    box.appendChild(div);
  });
}


/* ============================================================
   GAME
   ============================================================ */

function startGame(){

  document.getElementById("draftArea")
    .classList.add("hidden");

  document.getElementById("game")
    .classList.remove("hidden");

  document.getElementById("gameOpponentLabel")
    .textContent=opponent.mark;

  userScore=0;
  opponentScore=0;
  inning=1;
  half="top";

  updateScoreboard();

  document.getElementById("playByPlay").textContent=
    `The first pitch is coming. `+
    `${opponent.name} is on the other side.`;

}


/* ============================================================
   SCOREBOARD
   ============================================================ */

function ordinal(n){

  if(n===1)return"1ST";
  if(n===2)return"2ND";
  if(n===3)return"3RD";

  return`${n}TH`;
}


function updateScoreboard(){

  document.getElementById("userScore")
    .textContent=String(userScore);

  document.getElementById("oppScore")
    .textContent=String(opponentScore);

  document.getElementById("inningDisplay")
    .textContent=
      `${half==="top"?"TOP":"BOTTOM"} ${ordinal(inning)}`;
}


/* ============================================================
   GAME SIMULATION
   ============================================================ */

function simulateHalfInning(){

  if(!Object.keys(myField).length)
    return;

  let runs=0;

  if(half==="top"){

    const hitters=
      Object.values(myField)
        .filter(Boolean);

    const offense=
      average(
        hitters.map(p=>
          (
            p.stats.power+
            p.stats.contact+
            p.stats.clutch
          )/3
        )
      );

    const defense=
      average(
        opponentRoster
          .filter(p=>p.type==="P")
          .map(p=>
            (
              p.stats.velocity+
              p.stats.movement+
              p.stats.control+
              p.stats.strikeouts
            )/4
          )
      )||70;

    runs=
      baseballRuns(
        offense,
        defense
      );

    userScore+=runs;

    document.getElementById("playByPlay")
      .textContent=
        describeHalfInning(
          true,
          runs
        );

    half="bottom";

  }else{

    const hitters=
      opponentRoster
        .filter(p=>p.type!=="P");

    const offense=
      average(
        hitters.map(p=>
          (
            p.stats.power+
            p.stats.contact+
            p.stats.clutch
          )/3
        )
      )||70;

    const pitchers=
      Object.values(myPitch)
        .filter(Boolean);

    const defense=
      average(
        pitchers.map(p=>
          (
            p.stats.velocity+
            p.stats.movement+
            p.stats.control+
            p.stats.strikeouts
          )/4
        )
      )||70;

    runs=
      baseballRuns(
        offense,
        defense
      );

    opponentScore+=runs;

    document.getElementById("playByPlay")
      .textContent=
        describeHalfInning(
          false,
          runs
        );

    half="top";
    inning++;
  }

  updateScoreboard();
}


function baseballRuns(offense,pitching){

  const difference=
    offense-pitching;

  const expected=
    0.42+
    difference*.025;

  const random=
    Math.random();

  if(random<Math.max(.04,expected*.18))
    return 0;

  if(random<Math.min(.76,expected+.25))
    return 1;

  if(random<Math.min(.91,expected+.40))
    return 2;

  if(random<.975)
    return 3;

  return 4;
}


function describeHalfInning(user,runs){

  if(runs===0)
    return user
      ?"The opposing pitcher shuts the door. No runs."
      :"Your pitching staff works out of the inning.";

  if(runs===1)
    return user
      ?"A clutch hit puts one on the board."
      :"The opponent manufactures one run.";

  if(runs===2)
    return user
      ?"A hard double and a timely hit bring two home."
      :"Two runs score after the opponent strings together hits.";

  if(runs===3)
    return user
      ?"The lineup breaks through for three runs."
      :"The championship lineup erupts for three.";

  return user
    ?"Four runs! The lineup just exploded."
    :"A huge inning puts four on the board.";
}


/* ============================================================
   MANAGEMENT
   ============================================================ */

function bringInReliever(){

  const relievers=
    Object.keys(myPitch)
      .filter(id=>
        id.startsWith("RP")||
        id==="CL"
      )
      .map(id=>myPitch[id])
      .filter(Boolean);

  if(!relievers.length){

    document.getElementById("playByPlay")
      .textContent=
        "There isn't a reliever available.";

    return;
  }

  const pitcher=
    relievers[
      Math.floor(
        Math.random()*relievers.length
      )
    ];

  currentPitcher=pitcher;

  document.getElementById("playByPlay")
    .textContent=
      `${pitcher.name} is coming into the game.`;
}


function useBenchPlayer(){

  const bench=
    FIELD_SLOTS
      .filter(s=>s.id.startsWith("B"))
      .map(s=>myField[s.id])
      .filter(Boolean);

  if(!bench.length){

    document.getElementById("playByPlay")
      .textContent=
        "No bench player is available.";

    return;
  }

  const player=
    bench[
      Math.floor(
        Math.random()*bench.length
      )
    ];

  document.getElementById("playByPlay")
    .textContent=
      `${player.name} is entering from the bench.`;
}


/* ============================================================
   STARTUP
   ============================================================ */

document.getElementById("opponentName")
  .textContent=opponent.name;

document.getElementById("opponentMark")
  .textContent=opponent.mark;

updateDraftTitle();
renderMyRoster();

/*
  Draw the empty radar immediately.
*/

updateRadar();

/*
  Load the actual historical championship roster.
*/

loadOpponentRoster();

/*
  Generate the first five choices.
*/

generateChoices();
